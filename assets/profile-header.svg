<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Fábio Eduardo dos Santos</title>
  <desc id="desc">Engenheiro de Software Sênior com atuação em Android, Java, PHP, SAP Business One, APIs, Cloud e liderança de engenharia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b3b5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="30" r="150" fill="#1f6feb" opacity=".12" filter="url(#soft)"/>
  <circle cx="1030" cy="280" r="170" fill="#3fb950" opacity=".10" filter="url(#soft)"/>

  <g opacity=".12" stroke="#8b949e" stroke-width="1">
    <path d="M760 45H1140"/>
    <path d="M790 85H1170"/>
    <path d="M730 125H1110"/>
    <path d="M810 165H1180"/>
    <path d="M750 205H1130"/>
    <path d="M795 245H1170"/>
  </g>

  <rect x="64" y="62" width="112" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="126" fill="#f0f6fc" font-size="46" font-weight="700"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    Fábio Eduardo dos Santos
  </text>
  <text x="64" y="174" fill="#c9d1d9" font-size="24" font-weight="500"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    Engenheiro de Software Sênior
  </text>
  <text x="64" y="216" fill="#8b949e" font-size="19"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    Android/Kotlin • Java • PHP • SAP Business One • APIs e Cloud
  </text>
  <text x="64" y="249" fill="#8b949e" font-size="19"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    Liderança Técnica e de Engenharia
  </text>

  <g transform="translate(815,90)">
    <rect x="0" y="0" width="305" height="142" rx="18" fill="#161b22" stroke="#30363d"/>
    <circle cx="34" cy="33" r="7" fill="#3fb950"/>
    <text x="54" y="40" fill="#f0f6fc" font-size="16" font-weight="600"
          font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace">
      construir()
    </text>
    <text x="24" y="78" fill="#79c0ff" font-size="15"
          font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace">
      mobile + api + dados
    </text>
    <text x="24" y="105" fill="#a5d6ff" font-size="15"
          font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace">
      integração + cloud
    </text>
    <text x="24" y="132" fill="#7ee787" font-size="15"
          font-family="ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace">
      qualidade + liderança
    </text>
  </g>
