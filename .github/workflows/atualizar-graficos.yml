name: Atualizar gráficos do perfil

on:
  schedule:
    # 03:17 em Brasília (UTC-3)
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-graficos:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v5

      - name: Gerar calendário 3D de contribuições
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Gerar animação das contribuições
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/contribution-snake.svg?palette=github-light
            assets/contribution-snake-dark.svg?palette=github-dark

      - name: Publicar gráficos atualizados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/contribution-snake.svg assets/contribution-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos gráficos."
            exit 0
          fi

          git commit -m "chore: atualiza gráficos de contribuições"
          git push
